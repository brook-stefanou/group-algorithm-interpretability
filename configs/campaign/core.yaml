# The pre-registered core-study campaign: the fixed, ordered cell list this
# repository commits to running. This file doubles as the pre-registered run
# list (`docs/methodology.md`'s "manual and pre-registered" group selection)
# and as the input `scripts/run_campaign.py` iterates -- there is no coverage
# panel, selection solver, or quota here, only this table.
#
# Derived from the study design in `docs/core-study.md` (the group table and
# the run plan). Every (order, index) was checked against
# `data/group_properties_full.jsonl` before this file was written, and
# `scripts/run_campaign.py` re-checks it at run time.
#
# Two pre-registered phases, in the order they must run (phase 0 settles the
# width and the seed count before any core cell trains -- see
# `docs/core-study.md`, "Run plan"):
#
#   pilot  5 groups x widths {64, 128, 256} x 10 seeds, to the 30,000-epoch
#          ceiling, early stopping off (the repository default:
#          optim.stop_on_generalize is false unless a run overrides it, so no
#          cell needs to say so explicitly).
#   core   the 36 core-study groups x one width (128, the phase-0-chosen
#          width) x 50 paired seeds. Same 30,000-epoch ceiling, same default
#          early-stopping-off.
#
# Two further OPT-IN phases, run only when `scripts/run_campaign.py` is given
# `--include-bonus` (without the flag they are excluded entirely, including
# from --dry-run listings). They are NOT part of the pre-registered core
# study and are never pooled into its counts (39 groups / 1,950 models):
# they are extension supply run as tail-filler, always after every core
# cell:
#
#   bonus-e6  the E6 bundle: 6 groups x width 128 x 50 seeds.
#   bonus-e2  the first 10 order-128 GENUINE_CLEAN pairs from the falsifier
#             screen (extension supply, E2): 20 groups x width 128 x 50
#             seeds.
#
# Cells are ordered cheapest-first WITHIN EACH PHASE by ascending group order
# (ties broken by ascending index, then ascending width) -- not by claim
# (C1..C5). `docs/core-study.md`'s run plan groups by claim
# (C1 -> C2 -> C3 -> C4 -> C5, cheapest-first within each claim) for the
# writeup; this file reorders for wall-clock efficiency, since cost scales
# with group order (~|G|^2.119) and nothing else here.
#
# Every cell composes with `experiment=<experiment>` plus
# `data.group.order=<order> data.group.index=<index> model.d_model=<width>`,
# and runs its `seeds` range (Python slice syntax, STOP exclusive) as one
# `scripts/run_batch.py` invocation. `note` is documentation only (the
# group's role and the one-line rationale from `docs/core-study.md`'s group
# table) -- it is never read by the runner.

