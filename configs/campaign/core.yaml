# The pre-registered core-study campaign restart (v2): the fixed, ordered cell
# list this repository commits to running. This file doubles as the
# pre-registered run list (`docs/methodology.md`'s "manual and pre-registered"
# group selection) and as the input `scripts/run_campaign.py` iterates --
# there is no coverage panel, selection solver, or quota here, only this
# table.
#
# Derived from the study design in `docs/core-study.md` (the group table and
# the run plan), then revised for the 2026-07-20 campaign restart after Brook
# terminated pod `irhcmk2u1aqp6a` mid-campaign 2026-07-16. Every (order,
# index) was checked against `data/group_properties_full.jsonl` before this
# file was written, and `scripts/run_campaign.py` re-checks it at run time.
# The restart decisions and their rationale are recorded in
# `internal/docs/handoff.md`; the file this replaced (30,000-epoch ceiling,
# width 128 only, no `extra` phase) is in git history.
#
# Phases, in execution order (cheapest-first within each phase by ascending
# group order, ties by ascending index then ascending width):
#
#   pilot   ONE smoke cell: D32 w128 seeds 0:2. Verifies the pipeline and the
#           verified S3 ship end to end before any core cell starts -- no
#           fresh phase-0 pilot re-run, since width and seed count are
#           data-backed by the terminated campaign's 383 salvaged runs.
#   core    22 groups at w128, 5 of which (the D32/QD32/Q32 case study and the
#           GL(2,3)/(48,28) cocycle pair) ALSO run at w256 for a
#           width-sensitivity readout, plus 4 p-group probe groups run only
#           at w256 -- (27,3)/(27,4) and (54,10)/(54,11), observed
#           never-grokking at 30k/w128 in the terminated campaign, so w256 is
#           the untried width. The ten unobserved p-group heavies sharing
#           that construction (orders 81, 125, 243, 250) are excluded. 50
#           seeds per cell.
#   extra   D5 additions: (81,7) and the E8 coset-test pair (192,10)/(192,24),
#           width 128, 50 seeds. Requires the one-line `PHASES` edit in
#           `scripts/run_campaign.py` (adds "extra" between "core" and the
#           bonus phases). Extension supply, never pooled into the
#           pre-registered core counts -- but unlike the bonus phases it runs
#           unconditionally, the same as `core`, not gated behind
#           `--include-bonus`.
#   bonus-e6 / bonus-e2  carried over unchanged from the pre-restart file;
#           still opt-in via `--include-bonus`.
#
# Every cell runs to the 60,000-epoch ceiling in `configs/experiment/core.yaml`
# (raised from 30,000 for the restart). Cost scales with group order
# (~|G|^2.119) and roughly x1.76 per width doubling (`internal/restart_cost.py`
# derives the law). Early stopping stays off (the repository default); a seed
# not grokked at the ceiling is censored and recorded as `>60k`. Adam eps
# stays the PyTorch 1e-8 default on both training paths. Seeds are the paired
# 0:50 list on the pinned `data.split_seed`. `snapshot.final_window_epochs: 5`
# is the config default and applies to every cell.
#
# Every cell composes with `experiment=<experiment>` plus
# `data.group.order=<order> data.group.index=<index> model.d_model=<width>`,
# and runs its `seeds` range (Python slice syntax, STOP exclusive) as one
# `scripts/run_batch.py` invocation. `note` is documentation only (the
# group's role and the one-line rationale from `docs/core-study.md`'s group
# table, or the restart rationale) -- it is never read by the runner.

