# @package _global_
# A fast smoke run that exercises the whole pipeline end to end: `experiment=smoke`
# trains for a couple of hundred epochs, not to convergence.
#
# See configs/experiment/debug.yaml for why this preset sets `optim.epochs` (the
# knob the training loop iterates) rather than a run-length field of its own.
# This preset is no longer the composed default: it shortens a run, and the
# default must not, so configs/config.yaml selects `experiment: default`.
experiment:
  name: smoke
optim:
  epochs: 200
