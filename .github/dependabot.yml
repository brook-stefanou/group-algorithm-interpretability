version: 2

updates:
  # GitHub Actions used by ci.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python dependencies, resolved via uv (pyproject.toml + uv.lock). Dependabot's
  # native "uv" ecosystem reached general availability in March 2025; see
  # https://docs.astral.sh/uv/guides/integration/dependabot/.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns:
          - "*"
